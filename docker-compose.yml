# data/ is de volledige administratie: backup dat pad extern (bewaarplicht 7 jaar).
services:
  boekhond:
    build: .
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${POORT:-8085}:${POORT:-8085}"
    volumes:
      - ./data:/app/data
    env_file: .env
    # Binnen de container op alle interfaces binden, anders bereikt de gepubliceerde poort de listener niet.
    environment:
      - BIND_HOST=0.0.0.0
    # Een init als PID 1 stuurt SIGTERM door, zodat docker stop direct stopt in plaats van na 10 s SIGKILL.
    init: true
    restart: unless-stopped
